version: "3.8"

services:
  ihatepdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihatepdf
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Cloudinary (optional - uncomment and set if using)
      # - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      # - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      # - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # File upload settings
      - MAX_FILE_SIZE=104857600
      # Rate limiting
      - RATE_LIMIT_WINDOW_MINUTES=15
      - RATE_LIMIT_REQUESTS=50
      # CORS (optional - defaults to production domain)
      # - ALLOWED_ORIGINS=https://your-domain.com
    volumes:
      # Persist uploads directory (optional)
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ihatepdf-network

networks:
  ihatepdf-network:
    driver: bridge

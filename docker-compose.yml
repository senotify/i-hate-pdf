services:
  ihatepdf:
    build: .
    image: ghcr.io/senotify/ihatepdf:${TAG:-latest}
    container_name: ihatepdf-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=https://ihatepdf.senotify.com
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  proxy-network:
    external: true